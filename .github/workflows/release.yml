name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v3.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LeonDesk.csproj

      - name: Build
        run: dotnet build LeonDesk.csproj --configuration Release --no-restore

      - name: Publish (self-contained, win-x64, trimmed)
        run: dotnet publish LeonDesk.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:PublishReadyToRun=true -p:DebugType=none -p:DebugSymbols=false -o ./publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: EgeFire ${{ github.ref_name }}
          body: |
            ## EgeFire ${{ github.ref_name }}

            ### Değişiklikler
            - Custom window chrome (borderless, draggable, resize grip)
            - Light/Dark/System tema desteği
            - Web arama kısayolları (g, yt, gh, so, wk)
            - Not alma alanı (kalıcı, auto-save)
            - Çoklu monitör pozisyon hatırlama
            - GitHub Releases ile otomatik güncelleme kontrolü
            - Sistem tepsisi entegrasyonu (global hotkey, autorun)
          files: |
            ./publish/EgeFire.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (manual dispatch)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: EgeFire ${{ github.event.inputs.version }}
          body: |
            ## EgeFire ${{ github.event.inputs.version }}

            ### Değişiklikler
            - Custom window chrome (borderless, draggable, resize grip)
            - Light/Dark/System tema desteği
            - Web arama kısayolları (g, yt, gh, so, wk)
            - Not alma alanı (kalıcı, auto-save)
            - Çoklu monitör pozisyon hatırlama
            - GitHub Releases ile otomatik güncelleme kontrolü
            - Sistem tepsisi entegrasyonu (global hotkey, autorun)
          files: |
            ./publish/EgeFire.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
